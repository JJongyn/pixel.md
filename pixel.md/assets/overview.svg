    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#cdf09b"/><stop offset="1" stop-color="#79b77e"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="chatClip"><rect x="450" y="363" width="300" height="176"/></clipPath>
  </defs>
  <rect width="1200" height="650" fill="#f8f9f6"/>
