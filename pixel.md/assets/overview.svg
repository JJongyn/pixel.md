<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">pixel.md component overview</title>
  <desc id="desc">Three previews showing a pixel status indicator, an orbit effect around a chat input, and compact workflow elements.</desc>
  <defs>
